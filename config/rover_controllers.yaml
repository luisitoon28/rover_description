controller_manager:
  ros__parameters:
    update_rate: 20  # Hz

    rover_base_control:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scara_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Configuración detallada de la base móvil
rover_base_control:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    use_stamped_vel: false
    use_sim_time: true
    publish_rate: 50.0
    
    # Nombres de tus articulaciones (ajustado a tus 6 ruedas)
    left_wheel_names: ["front_left_wheel_joint", "middle_left_wheel_joint", "back_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "middle_right_wheel_joint", "back_right_wheel_joint"]
    
    wheel_separation: 1.40  # Valor de tu diseño
    wheel_radius: 0.40      # Valor de tu diseño
    
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: -1.0 # Invertido según el anexo

    base_frame_id: base_link
    enable_odom_tf: true

    publish_limited_velocity: true
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 3.0
        has_acceleration_limits: true
        max_acceleration: 3.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        has_acceleration_limits: true
        max_acceleration: 3.0

# Configuración del brazo (SCARA)
scara_controller:
  ros__parameters:
    joints:
      - scara_arm_1_link_joint
      - scara_arm_3_link_joint
      - Cylinder_rotational_joint
      - Cylinder_vertical_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# Configuración de la pinza (Gripper)
gripper_controller:
  ros__parameters:
    joints:
      - left_grip_joint
      - right_grip_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity